# Correspondance des ingrédients v1 -> référentiel v2 (pour le script de migration).
# Une ligne v1 peut produire plusieurs entrées (« sel, poivre », bouquet garni).
# ingredient: null + preparation: <slug> = la ligne v1 est une base (fond-blanc, fond-brun) et non un ingrédient.
# Cas particuliers :
#  - bouquet garni -> thym, laurier, persil (profil bouquet-garni) ; qte à reporter sur une seule entrée ou à ignorer.
#  - vanille (1 gousse) -> gousse-de-vanille, qte 1, unite "" (le nom contient déjà « gousse »).
#  - bâton de cannelle et feuille de laurier : nom de l'ingrédient contient l'unité, unite "".
#  - blanquette-de-veau-maison : mêmes ingrédients que blanquette-de-veau (version de la préparation).
